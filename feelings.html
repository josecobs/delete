<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete feelings button</title>
    <style>
        body {
            background-color: antiquewhite;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            
            /* Modern Flexbox centering */
            display: flex;
            flex-direction: column;   /* Stacks header and button vertically */
            align-items: center;       /* Centers them horizontally */
            justify-content: center;   /* Centers them vertically on the screen */
            min-height: 100vh;         /* Forces body to take full screen height */
            margin: 0;
            gap: 20px;                 /* Adds clean spacing between header and button */
        }
        
        h1 {
            margin: 0;
            letter-spacing: 1px;
            color: #333333;
        }

        .button-link {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        /* Adds a nice hover effect when the user hovers over the button */
        .button-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>DELETE YOUR FEELINGS</h1>
    <a href="ok.html" class="button-link">Click me</a>

</body>
</html>
